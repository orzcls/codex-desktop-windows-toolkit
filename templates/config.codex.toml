# Codex Desktop Windows template.
# Copy snippets into your private %USERPROFILE%\.codex\config.toml after review.
# Do not place live keys in this tracked template.

[features]
builtin_mcp = true
goals = true
plan_tool = true
rmcp_client = true
view_image_tool = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[mcp_servers.node_repl]
type = "stdio"
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\<YOU>\\.codex\\scripts\\start-openai-bundled-node-repl.ps1"]
startup_timeout_ms = 180000

[mcp_servers.node_repl.env]
APPDATA = "C:\\Users\\<YOU>\\AppData\\Roaming"
HOME = "C:\\Users\\<YOU>"
LOCALAPPDATA = "C:\\Users\\<YOU>\\AppData\\Local"
NODE_OPTIONS = "--dns-result-order=ipv4first"
NODE_REPL_NODE_PATH = "C:\\Users\\<YOU>\\.codex\\plugins\\cache\\openai-bundled\\chrome\\latest\\app-server-runtime\\node"
NODE_REPL_TRUSTED_CODE_PATHS = "C:\\Users\\<YOU>\\.codex\\plugins\\cache\\openai-bundled\\chrome\\latest\\scripts;C:\\Users\\<YOU>\\.codex\\plugins\\cache\\openai-bundled\\browser\\latest\\scripts"
SystemRoot = "C:\\Windows"

[mcp_servers.Fetch]
command = "cmd"
args = ["/c", "uvx", "mcp-server-fetch"]
env = { APPDATA = "C:\\Users\\<YOU>\\AppData\\Roaming", LOCALAPPDATA = "C:\\Users\\<YOU>\\AppData\\Local", NODE_OPTIONS = "--dns-result-order=ipv4first" }

[mcp_servers.PlaywrightMCP]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
env = { APPDATA = "C:\\Users\\<YOU>\\AppData\\Roaming", LOCALAPPDATA = "C:\\Users\\<YOU>\\AppData\\Local", NODE_OPTIONS = "--dns-result-order=ipv4first" }
